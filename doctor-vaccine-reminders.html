<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vaccine Reminders | Shivay Clinic</title>

    <link rel="stylesheet" href="doctor-vaccine-reminders.css">
</head>

<body>

    <!-- HEADER -->

    <header class="dashboard-header">

        <div>
            <h1>Shivay Clinic</h1>
            <p>Doctor Dashboard</p>
        </div>

        <div class="doctor-icon">
            👨‍⚕️
        </div>

    </header>


    <!-- MAIN -->

    <main class="dashboard-container">

        <div class="page-title">

            <div>
                <h2>🔔 Vaccine Reminders</h2>
                <p>Today's vaccine reminders and overdue vaccines</p>
            </div>

            <div class="today-date" id="todayDate">
                Loading...
            </div>

        </div>


        <!-- SUMMARY -->

        <section class="summary-grid">

            <div class="summary-card">
                <span class="summary-icon">🔔</span>

                <div>
                    <h3 id="dueCount">0</h3>
                    <p>Due / Overdue</p>
                </div>
            </div>


            <div class="summary-card">
                <span class="summary-icon">👨‍👩‍👧</span>

                <div>
                    <h3 id="parentCount">0</h3>
                    <p>Parent Reminders</p>
                </div>
            </div>


            <div class="summary-card">
                <span class="summary-icon">👨‍⚕️</span>

                <div>
                    <h3 id="doctorCount">0</h3>
                    <p>Doctor Reminders</p>
                </div>
            </div>

        </section>


        <!-- VACCINE LIST -->

        <section class="reminders-section">

            <div class="section-header">

                <h2>Today's Vaccine Alerts</h2>

                <button
                    class="refresh-btn"
                    onclick="loadVaccineReminders()">
                    🔄 Refresh
                </button>

            </div>


            <div id="reminderList">

                <div class="loading">
                    Loading vaccine reminders...
                </div>

            </div>

        </section>

    </main>


    <script src="doctor-vaccine-reminders.js"></script>

</body>
</html>
